[project]
name = "kul-padel-bot"
version = "0.1.0"
description = "Automated padel reservation bot for KU Leuven Sport"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "cryptography>=42",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "loguru>=0.7",
    "click>=8.1",
    "discord.py>=2.4",
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
# Only needed on the workstation that does interactive login.
# The Pi doesn't need playwright — it only runs refresh + booking.
login = ["playwright>=1.45"]

[project.scripts]
padelbot = "padelbot.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/padelbot"]
