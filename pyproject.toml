[project]
name = "kul-padel-bot"
version = "0.1.0"
description = "Automated padel reservation bot for KU Leuven Sport"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "cryptography>=42",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "loguru>=0.7",
    "click>=8.1",
    "discord.py>=2.6.4",
    "beautifulsoup4>=4.12",
    "websocket-client>=1.8",
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
# Needed for browser login or the optional Worldline payment driver.
# HTTP login and session renewal do not require Chromium.
login = ["playwright>=1.45"]
android = ["uiautomator2>=3.2,<4"]
dev = ["pytest>=8"]

[project.scripts]
padelbot = "padelbot.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/padelbot"]
